<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel de Licencias</title>
<style>body{font-family:Segoe UI;background:#0b0d10;color:#eee;margin:0}.wrap{max-width:1100px;margin:30px auto;padding:20px}.card{background:#15191f;border:1px solid #28303a;border-radius:12px;padding:18px;margin-bottom:16px}input,button{padding:10px;border-radius:7px;border:1px solid #3a4652;background:#0f1318;color:#fff}button{cursor:pointer;background:#0877c9}.danger{background:#b33434}.ok{background:#22986d}.muted{color:#9aa5b1}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #28303a;padding:9px;text-align:left;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap}.grow{flex:1;min-width:180px}</style></head><body><div class="wrap">
<h1>Panel de Licencias</h1><p class="muted">Cambia la AdminKey en appsettings.json antes de publicar el servidor.</p>
<div class="card"><div class="row"><input id="admin" class="grow" type="password" placeholder="Admin key"><button onclick="load()">ENTRAR / ACTUALIZAR</button></div></div>
<div class="card"><h3>Nueva licencia</h3><div class="row"><input id="customer" class="grow" placeholder="Cliente"><input id="customKey" class="grow" placeholder="Clave opcional (vacío = automática)"><input id="expiry" type="date"><button class="ok" onclick="createLic()">CREAR</button></div></div>
<div class="card"><h3>Licencias</h3><div style="overflow:auto"><table><thead><tr><th>Cliente</th><th>Clave</th><th>HWID</th><th>Estado</th><th>Expira</th><th>Acciones</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</div><script>
const h=()=>({'Content-Type':'application/json','X-Admin-Key':document.getElementById('admin').value});
async function load(){let r=await fetch('/api/admin/licenses',{headers:h()});if(!r.ok){alert('Admin key incorrecta');return;}let a=await r.json();document.getElementById('rows').innerHTML=a.map(x=>`<tr><td>${esc(x.customer)}</td><td><code>${esc(x.licenseKey)}</code></td><td>${esc(x.hwid||'Sin vincular')}</td><td>${x.active?'ACTIVA':'DESACTIVADA'}</td><td>${x.expiresAt?new Date(x.expiresAt).toLocaleDateString():'Sin expiración'}</td><td><button onclick="toggle('${x.id}',${!x.active})">${x.active?'Desactivar':'Activar'}</button> <button onclick="clearHwid('${x.id}')">Liberar HWID</button> <button class="danger" onclick="del('${x.id}')">Borrar</button></td></tr>`).join('');}
async function createLic(){let e=document.getElementById('expiry').value;let body={customer:document.getElementById('customer').value,licenseKey:document.getElementById('customKey').value,active:true,expiresAt:e?new Date(e+'T23:59:59Z').toISOString():null};let r=await fetch('/api/admin/licenses',{method:'POST',headers:h(),body:JSON.stringify(body)});if(!r.ok){alert(await r.text());return;}await load();}
async function toggle(id,v){await fetch('/api/admin/licenses/'+id,{method:'PATCH',headers:h(),body:JSON.stringify({active:v})});await load();}
async function clearHwid(id){await fetch('/api/admin/licenses/'+id,{method:'PATCH',headers:h(),body:JSON.stringify({clearHwid:true})});await load();}
async function del(id){if(!confirm('¿Borrar licencia?'))return;await fetch('/api/admin/licenses/'+id,{method:'DELETE',headers:h()});await load();}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script></body></html>
